<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Mathe-Training für die Lehre als Elektroinstallateur/in EFZ – mit Erklärungen, Lösungswegen, Wochenplan und Prüfungstest.">
<meta name="theme-color" content="#1b2130">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mathe Elektro">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Mathe-Werkstatt Elektro</title>
<style>
@font-face{font-family:"Atkinson Hyperlegible";font-weight:400;font-style:normal;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-weight:700;font-style:normal;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:600;font-style:normal;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:700;font-style:normal;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format("woff2")}
:root{
  /* Layout: Karopapier-Heft; Übersicht als Verteilerkasten mit Sicherungen; Akzente in den Aderfarben L braun, N blau, PE grün-gelb */
  --paper:#f6f6f1; --grid:rgba(31,86,181,.075); --card:#ffffff; --ink:#1b2130; --muted:#586174; --line:#d8dad2;
  --blue:#1f56b5; --blue-ink:#ffffff; --brown:#7c4420; --pe-g:#2f8f3a; --pe-y:#efc31a;
  --good:#22803a; --good-bg:#e5f3e7; --bad:#b5382b; --bad-bg:#fbe8e5; --hint-bg:#fff6d6;
  --housing:#e2e4e7; --breaker:#fbfbfa; --slot:#2b2f36; --fig-fill:rgba(31,86,181,.07);
  --shadow:0 1px 2px rgba(20,30,50,.08),0 6px 18px rgba(20,30,50,.06);
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#13161c; --grid:rgba(120,160,235,.07); --card:#1b1f27; --ink:#e8eaef; --muted:#9aa3b4; --line:#2e3441;
    --blue:#7aa4f2; --blue-ink:#0d1424; --brown:#d79363; --pe-g:#4cb757; --pe-y:#efc31a;
    --good:#5fc86f; --good-bg:#15301b; --bad:#f38474; --bad-bg:#3b1d19; --hint-bg:#352d10;
    --housing:#232831; --breaker:#2f3542; --slot:#0f1217; --fig-fill:rgba(122,164,242,.1);
    --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#13161c; --grid:rgba(120,160,235,.07); --card:#1b1f27; --ink:#e8eaef; --muted:#9aa3b4; --line:#2e3441;
  --blue:#7aa4f2; --blue-ink:#0d1424; --brown:#d79363; --pe-g:#4cb757; --pe-y:#efc31a;
  --good:#5fc86f; --good-bg:#15301b; --bad:#f38474; --bad-bg:#3b1d19; --hint-bg:#352d10;
  --housing:#232831; --breaker:#2f3542; --slot:#0f1217; --fig-fill:rgba(122,164,242,.1);
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:20px 20px;
  color:var(--ink); font:400 17px/1.5 var(--body);
}
a{color:var(--blue)}
.wrap{max-width:760px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(64px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.05}
h2{font-size:1.7rem;font-weight:700;letter-spacing:.01em}
h3{font-size:1.3rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
section{display:flex;flex-direction:column;gap:12px}

/* Kabel: drei Adern */
.wires{display:grid;gap:3px;width:100%}
.wires i{display:block;height:5px;border-radius:3px}
.wires i:nth-child(1){background:var(--brown)}
.wires i:nth-child(2){background:var(--blue)}
.wires i:nth-child(3){background:repeating-linear-gradient(-50deg,var(--pe-g) 0 9px,var(--pe-y) 9px 18px)}

/* Kopf */
.hero{display:flex;flex-direction:column;gap:12px;padding-top:12px}
.eyebrow{font:600 .95rem var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--brown)}
.hero h1{font-size:clamp(2.7rem,11vw,4.4rem);font-weight:700;text-transform:uppercase;letter-spacing:-.01em;line-height:.9}
.hero h1 span{color:var(--blue);display:block}
.hero p{max-width:34em;font-size:1.05rem}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:4px}
.topbar a{white-space:nowrap;font:700 1.1rem var(--display);text-decoration:none;color:var(--ink);letter-spacing:.04em;text-transform:uppercase}
.topbar a span{color:var(--blue)}
.back{font:700 1rem var(--body)!important;text-transform:none!important;letter-spacing:0!important;color:var(--blue)!important}

/* Karten, Knöpfe */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{font:700 1rem var(--body);padding:.7em 1.1em;min-height:48px;border-radius:10px;border:2px solid var(--blue);background:transparent;color:var(--blue);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:.4em}
.btn.primary{background:var(--blue);color:var(--blue-ink)}
.btn.ghost{border-color:var(--line);color:var(--ink)}
.btn.small{min-height:40px;padding:.45em .8em;font-size:.95rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:.35em;font:700 .8rem var(--body);padding:.2em .6em;border-radius:99px;border:1px solid var(--line);color:var(--muted);background:var(--card)}
.chip.calc{border-color:var(--pe-y);color:var(--ink);background:var(--hint-bg)}

/* Heute */
.today{border-left:6px solid var(--brown)}
.today .label{font:700 .9rem var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--brown)}
.today ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:2px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px}
.tile b{font:700 2rem/1 var(--display);font-variant-numeric:tabular-nums}
.tile span{font-size:.85rem;color:var(--muted);line-height:1.25}

/* Verteilerkasten */
.panel{background:var(--housing);border-radius:14px;padding:12px 10px 14px;box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;gap:6px}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;font:700 .85rem var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:0 4px}
.rail{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;position:relative;padding:6px 0}
.rail::before{content:"";position:absolute;left:-6px;right:-6px;top:50%;height:16px;transform:translateY(-50%);background:repeating-linear-gradient(90deg,#8e949c 0 2px,#b3b8bf 2px 9px);opacity:.55;border-radius:2px}
.brk{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--breaker);border:1px solid var(--line);border-radius:6px;padding:8px 3px 9px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);min-height:158px;transition:transform .15s}
.brk:hover{transform:translateY(-2px)}
.brk-f{font:700 .85rem var(--display);letter-spacing:.04em;background:var(--ink);color:var(--paper);padding:0 6px;border-radius:3px}
.brk-sw{display:flex;flex-direction:column;align-items:center;font:700 .72rem/1 var(--display);color:var(--muted);gap:2px}
.brk-slot{width:22px;height:46px;background:var(--slot);border-radius:4px;position:relative}
.brk-lever{position:absolute;left:2px;right:2px;height:21px;bottom:2px;background:linear-gradient(#ececec,#c4c6c9);border-radius:3px;transition:bottom .3s ease}
.brk.on .brk-lever{bottom:23px;background:linear-gradient(#86d891,#2f9a40)}
.brk-leds{display:flex;gap:4px}
.led{width:9px;height:9px;border-radius:50%;background:#a7adb6;display:inline-block}
.led.busy{background:var(--pe-y)}
.led.ok{background:var(--good);box-shadow:0 0 6px var(--good)}
.brk-name{font:600 .8rem/1.08 var(--display);text-align:center;hyphens:manual;overflow-wrap:break-word;max-width:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.85rem;color:var(--muted);padding:0 4px}
.legend span{display:inline-flex;align-items:center;gap:6px}

.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tool{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow);border-top:4px solid var(--blue)}
.tool:nth-child(2){border-top-color:var(--brown)}
.tool:nth-child(3){border-top-color:var(--pe-g)}
.tool:nth-child(4){border-top-color:var(--pe-y)}
.tool b{font:700 1.25rem var(--display)}
.tool span{font-size:.9rem;color:var(--muted);line-height:1.3}

/* Thema */
.t-head{display:flex;flex-direction:column;gap:8px}
.t-head .fuse{align-self:flex-start;font:700 .9rem var(--display);background:var(--ink);color:var(--paper);padding:1px 8px;border-radius:4px;letter-spacing:.05em}
.t-head h1{font-size:clamp(2.1rem,8vw,3rem);font-weight:700}
.why{font-size:.95rem;color:var(--muted)}
.tabs{display:flex;gap:6px;border-bottom:2px solid var(--line)}
.tabs button{font:700 1rem var(--body);background:none;border:0;padding:.6em .9em;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brown)}
.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lvl{font:700 1rem var(--body);background:var(--card);border:2px solid var(--line);border-radius:10px;padding:8px 6px;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:5px}
.lvl small{font-weight:400;color:var(--muted);font-size:.78rem}
.lvl[aria-pressed="true"]{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.lvl.done{background:var(--good-bg)}
.meter{display:flex;gap:2px;max-width:100%}
.meter i{width:7px;height:7px;border-radius:2px;background:var(--line);flex:0 0 auto}
.meter i.y{background:var(--good)}
.meter i.n{background:var(--bad)}
.lvl-info{font-size:.9rem;color:var(--muted)}

.qcard{gap:14px}
.qhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;font-size:.9rem;color:var(--muted)}
.streak{color:var(--good);font-weight:700}
.qtext{font-size:1.32rem;line-height:1.45;font-variant-numeric:tabular-nums}
.ans{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center}
.ans .pre{font:700 1.3rem var(--body)}
.ans input{font:700 1.45rem var(--body);padding:.4em .6em;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:100%;min-width:0}
.ans input:focus{border-color:var(--blue);outline:none}
.ans .unit{font:700 1.15rem var(--body);color:var(--muted);min-width:1ch}
.ans .btn{grid-column:1 / -1}
.keys{display:flex;gap:8px}
.keys button{font:700 1.3rem var(--body);width:52px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.mc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mc button{font:700 1.2rem var(--body);min-height:56px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;padding:6px}
.mc button.sel{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.mc button.right{border-color:var(--good);background:var(--good-bg)}
.mc button.wrong{border-color:var(--bad);background:var(--bad-bg)}
.fb{display:flex;flex-direction:column;gap:10px}
.msg{border-radius:10px;padding:12px 14px;border-left:6px solid var(--line);background:var(--card)}
.msg.good{background:var(--good-bg);border-left-color:var(--good)}
.msg.bad{background:var(--bad-bg);border-left-color:var(--bad)}
.msg.hint{background:var(--hint-bg);border-left-color:var(--pe-y)}
.msg strong{display:block;font:700 1.15rem var(--display);letter-spacing:.02em;margin-bottom:2px}
.steps{margin:6px 0 0;padding-left:1.4em;display:flex;flex-direction:column;gap:4px;font-variant-numeric:tabular-nums}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.86em;line-height:1.1;margin:0 .12em}
.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 .2em}
.fig{width:100%;max-width:330px;display:block;margin:0 auto}
.fig rect,.fig path{fill:var(--fig-fill);stroke:var(--blue);stroke-width:2.5}
.fig .cut{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4}
.fig .hot{stroke:var(--brown);stroke-width:3.5}
.fig text{fill:var(--ink);font:700 14px var(--body)}
.fig .q{fill:var(--brown);font-size:20px}

/* Erklärungen */
.expl{display:flex;flex-direction:column;gap:12px}
.rule{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.rule h3{font-size:1.2rem}
.rule .ex{font-variant-numeric:tabular-nums;background:var(--paper);border-radius:6px;padding:6px 10px}
.job{border-left-color:var(--brown)}
.tri{width:150px;color:var(--ink);display:block}
.tri text{fill:currentColor;font-family:var(--body)}
table.mini{border-collapse:collapse;font-variant-numeric:tabular-nums}
table.mini td,table.mini th{border:1px solid var(--line);padding:4px 10px;text-align:right}

/* Test */
.testbar{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700}
.timer{font:700 1.6rem var(--display);font-variant-numeric:tabular-nums;padding:2px 10px;border-radius:8px;background:var(--ink);color:var(--paper)}
.timer.low{background:var(--bad)}
.jump{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.jump button{font:700 .85rem var(--body);height:34px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;padding:0}
.jump button.done{background:var(--fig-fill);border-color:var(--blue)}
.jump button.cur{outline:2px solid var(--brown);outline-offset:1px}
.res-list{display:flex;flex-direction:column;gap:8px}
.res-item{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--good);border-radius:10px;padding:10px 14px}
.res-item.no{border-left-color:var(--bad)}
.res-item summary{cursor:pointer;display:flex;flex-direction:column;gap:4px}
.res-item .qtext{font-size:1.05rem}
.big{font:700 clamp(3rem,14vw,4.5rem)/1 var(--display);font-variant-numeric:tabular-nums}
.bars{display:flex;flex-direction:column;gap:6px}
.bar-row{display:grid;grid-template-columns:8.5em 1fr 3em;gap:8px;align-items:center;font-size:.92rem}
.bar-row .track{height:12px;background:var(--line);border-radius:6px;overflow:hidden}
.bar-row .fill{height:100%;background:var(--good);border-radius:6px}
.bar-row .fill.mid{background:var(--pe-y)}
.bar-row .fill.low{background:var(--bad)}
.hist{display:flex;gap:6px;align-items:flex-end;height:70px}
.hist div{flex:1;background:var(--blue);border-radius:4px 4px 0 0;min-height:3px;position:relative}
.hist div span{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:.75rem;color:var(--muted)}

/* Blitz */
.blitz-q{font:700 clamp(3rem,15vw,5rem)/1 var(--display);text-align:center;font-variant-numeric:tabular-nums;padding:8px 0}
.tbar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.tbar div{height:100%;background:var(--brown);transition:width .2s linear}
.flash-ok{animation:fok .35s}
.flash-no{animation:fno .35s}
@keyframes fok{from{background:var(--good-bg)}to{background:var(--card)}}
@keyframes fno{from{background:var(--bad-bg)}to{background:var(--card)}}

/* Plan */
.weeks{display:flex;flex-direction:column;gap:10px}
.week{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.week.now{border:2px solid var(--brown)}
.week.fin{opacity:.72}
.week header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.wk{font:700 .85rem var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--brown);min-width:5.5em}
.week header a{margin-left:auto;font-weight:700}
.sess{display:flex;flex-wrap:wrap;gap:8px}
.sess label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:.92rem}
.sess input{width:20px;height:20px;accent-color:var(--good)}
.install{border-left:6px solid var(--blue)}
.code{width:100%;min-height:90px;font:400 .8rem/1.3 ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--line);border-radius:10px;padding:8px;background:var(--card);color:var(--ink);word-break:break-all}
.tips{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:8px}

@media (max-width:420px){
  .tiles b{font-size:1.6rem}
  .qtext{font-size:1.2rem}
  .bar-row{grid-template-columns:7em 1fr 2.6em}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none!important;animation:none!important}
}
</style>

<body>
<main class="wrap" id="app"></main>
<script>
(function(){
'use strict';

/* ---------- Hilfsfunktionen ---------- */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const P=a=>a[Math.floor(Math.random()*a.length)];
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){const t=b;b=a%b;a=t;}return a;};
const clean=n=>Math.round(n*1e6)/1e6;
const N=n=>clean(n).toLocaleString('de-CH',{maximumFractionDigits:6}).replace(/-/g,'−');
const C=n=>clean(n).toLocaleString('de-CH',{minimumFractionDigits:2,maximumFractionDigits:2});
const NP=n=>n<0?'('+N(n)+')':N(n);
const fr=(n,d)=>(d===1)?N(n):'<span class="fr"><span>'+n+'</span><span>'+d+'</span></span>';
const red=(n,d)=>{const g=gcd(n,d);return [n/g,d/g];};
const sg=n=>n<0?'− '+(-n):'+ '+n;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const terminates=d=>{while(d%2===0)d/=2;while(d%5===0)d/=5;return d===1;};
const mk=o=>{const it=Object.assign({u:'',tol:0,rel:0,kind:'num',hint:'',steps:[]},o);if(typeof it.a==='number')it.a=clean(it.a);return it;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function addSteps(a,b){const parts=[b-b%100,(b%100)-(b%10),b%10].filter(x=>x>0);let c=a;const s=['Schritt für Schritt:'];parts.forEach(p=>{s.push(`${N(c)} + ${N(p)} = ${N(c+p)}`);c+=p;});s.push(`Ergebnis: <b>${N(a+b)}</b>`);return s;}
function subSteps(a,b){const parts=[b-b%100,(b%100)-(b%10),b%10].filter(x=>x>0);let c=a;const s=['Schritt für Schritt:'];parts.forEach(p=>{s.push(`${N(c)} − ${N(p)} = ${N(c-p)}`);c-=p;});s.push(`Ergebnis: <b>${N(a-b)}</b>`);return s;}
function divSteps(a,b,q){const t=q-q%10;if(t===0||t===q)return [`Probe mit der Reihe: ${b} × ${q} = ${N(a)}`,`Also: ${N(a)} : ${b} = <b>${q}</b>`];const p1=b*t,p2=a-p1;return [`Zerlegen: ${N(a)} = ${N(p1)} + ${N(p2)}`,`${N(p1)} : ${b} = ${t}`,`${N(p2)} : ${b} = ${q-t}`,`${t} + ${q-t} = <b>${q}</b>`];}

function rectSvg(l,b){const s=Math.min(160/l,90/b),w=l*s,h=b*s,x=(240-w)/2+8,y=(130-h)/2+8;
  return `<svg class="fig" viewBox="0 0 240 140" role="img" aria-label="Rechteck ${l} m mal ${b} m"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2"/><text x="${x+w/2}" y="${y-7}" text-anchor="middle">${N(l)} m</text><text x="${x-7}" y="${y+h/2+5}" text-anchor="end">${N(b)} m</text></svg>`;}
function lSvg(L,B,a,b){const s=Math.min(170/L,100/B),W=L*s,H=B*s,x=(240-W)/2,y=(140-H)/2+4,ca=a*s,cb=b*s;
  const d=`M${x} ${y} H${x+W-ca} V${y+cb} H${x+W} V${y+H} H${x} Z`;
  return `<svg class="fig" viewBox="0 0 240 150" role="img" aria-label="L-förmiger Raum"><rect class="cut" x="${x+W-ca}" y="${y}" width="${ca}" height="${cb}"/><path d="${d}"/><text x="${x+W/2}" y="${y+H+17}" text-anchor="middle">${L} m</text><text x="${x-7}" y="${y+H/2+5}" text-anchor="end">${B} m</text><text x="${x+W-ca/2}" y="${y-6}" text-anchor="middle">${a} m</text><text x="${x+W+6}" y="${y+cb/2+5}">${b} m</text></svg>`;}
function diagSvg(a,b){const s=Math.min(150/a,90/b),W=a*s,H=b*s,x=(240-W)/2-10,y=(140-H)/2-2;
  return `<svg class="fig" viewBox="0 0 240 150" role="img" aria-label="Wand mit schräger Leitung"><rect x="${x}" y="${y}" width="${W}" height="${H}"/><line class="hot" x1="${x}" y1="${y+H}" x2="${x+W}" y2="${y}"/><text x="${x+W/2}" y="${y+H+17}" text-anchor="middle">${N(a)} m</text><text x="${x+W+7}" y="${y+H/2+5}">${N(b)} m</text><text class="q" x="${x+W/2-10}" y="${y+H/2-6}" text-anchor="end">?</text></svg>`;}

const EX={
grund:`<div class="rule"><h3>Reihenfolge</h3><p>1. Klammern &nbsp;→&nbsp; 2. Punkt (× und :) &nbsp;→&nbsp; 3. Strich (+ und −)</p><p class="ex">5 + 3 × 4 = 5 + 12 = 17 &nbsp;(nicht 32!)</p></div>
<div class="rule"><h3>Zerlegen beim Malrechnen</h3><p class="ex">47 × 6 = 40 × 6 + 7 × 6 = 240 + 42 = 282</p></div>
<div class="rule"><h3>Zerlegen beim Teilen</h3><p class="ex">168 : 7 → 140 : 7 = 20 und 28 : 7 = 4 → 24</p></div>
<div class="rule"><h3>Probe machen</h3><p>Teilen kontrollierst du mit Malrechnen: 24 × 7 = 168 ✓</p></div>`,
neg:`<div class="rule"><h3>Der Zahlenstrahl</h3><p>Links von 0 sind die negativen Zahlen. Je weiter links, desto kleiner: −8 ist kleiner als −2.</p><p class="ex">… −3 −2 −1 0 1 2 3 …</p></div>
<div class="rule"><h3>Plus und Minus</h3><p>Plus eine negative Zahl = minus. Minus eine negative Zahl = plus.</p><p class="ex">5 + (−3) = 5 − 3 = 2<br>4 − (−6) = 4 + 6 = 10</p></div>
<div class="rule"><h3>Mal und geteilt</h3><p>Gleiche Vorzeichen → Ergebnis positiv. Verschiedene Vorzeichen → Ergebnis negativ.</p><p class="ex">(−3) · (−4) = 12 &nbsp;&nbsp; (−3) · 4 = −12 &nbsp;&nbsp; (−20) : 5 = −4</p></div>`,
dez:`<div class="rule"><h3>Plus und Minus</h3><p>Komma unter Komma schreiben. Fehlende Stellen mit 0 auffüllen.</p><p class="ex">3.75 + 1.4 = 3.75 + 1.40 = 5.15</p></div>
<div class="rule"><h3>Mal 10, 100, 1000</h3><p>× 10: Komma 1 Stelle nach rechts. : 10: Komma 1 Stelle nach links.</p><p class="ex">2.45 × 100 = 245 &nbsp;&nbsp; 36.5 : 10 = 3.65</p></div>
<div class="rule"><h3>Dezimalzahlen malnehmen</h3><p>Ohne Komma rechnen. Dann die Stellen nach dem Komma zusammenzählen.</p><p class="ex">0.4 × 1.5 → 4 × 15 = 60 → 2 Stellen → 0.60</p></div>
<div class="rule"><h3>Durch eine Dezimalzahl teilen</h3><p>Beide Zahlen gleich erweitern, bis der Teiler ganz ist.</p><p class="ex">7.5 : 0.5 = 75 : 5 = 15</p></div>
<div class="rule"><h3>Runden</h3><p>Schau die Ziffer nach der Rundungsstelle an: 0–4 abrunden, 5–9 aufrunden.</p><p class="ex">2.346 ≈ 2.35 &nbsp;&nbsp; 2.344 ≈ 2.34</p></div>`,
bruch:`<div class="rule"><h3>Bruch von einer Zahl</h3><p>Durch den Nenner teilen, mal den Zähler.</p><p class="ex">${fr(3,4)} von 80: 80 : 4 = 20, 20 × 3 = 60</p></div>
<div class="rule"><h3>Kürzen</h3><p>Zähler und Nenner durch die gleiche Zahl teilen.</p><p class="ex">${fr(6,8)} = ${fr(3,4)} &nbsp;(beide : 2)</p></div>
<div class="rule"><h3>Plus und Minus</h3><p>Gleicher Nenner: Zähler rechnen. Sonst zuerst die Nenner gleich machen (erweitern).</p><p class="ex">${fr(1,2)} + ${fr(1,4)} = ${fr(2,4)} + ${fr(1,4)} = ${fr(3,4)}</p></div>
<div class="rule"><h3>Mal und geteilt</h3><p>Mal: Zähler × Zähler, Nenner × Nenner. Geteilt: mit dem Kehrwert malnehmen.</p><p class="ex">${fr(2,3)} · ${fr(3,4)} = ${fr(6,12)} = ${fr(1,2)} &nbsp;&nbsp; ${fr(1,2)} : ${fr(1,4)} = ${fr(1,2)} · ${fr(4,1)} = 2</p></div>
<div class="rule"><h3>Auswendig lernen</h3><table class="mini"><tr><th>Bruch</th><td>${fr(1,2)}</td><td>${fr(1,4)}</td><td>${fr(3,4)}</td><td>${fr(1,5)}</td><td>${fr(1,10)}</td></tr><tr><th>Dezimal</th><td>0.5</td><td>0.25</td><td>0.75</td><td>0.2</td><td>0.1</td></tr><tr><th>Prozent</th><td>50 %</td><td>25 %</td><td>75 %</td><td>20 %</td><td>10 %</td></tr></table></div>`,
proz:`<div class="rule"><h3>Was ist Prozent?</h3><p>Prozent heisst «von hundert». 1 % = ${fr(1,100)}.</p></div>
<div class="rule"><h3>Schnelle Tricks</h3><p class="ex">10 % = durch 10 &nbsp;·&nbsp; 50 % = Hälfte &nbsp;·&nbsp; 25 % = Viertel &nbsp;·&nbsp; 1 % = durch 100</p><p class="ex">20 % von 350 = 2 × 35 = 70</p></div>
<div class="rule"><h3>Die drei Grundaufgaben</h3><p>Prozentwert: Ganzes : 100 × Prozent<br>Prozentsatz: Teil : Ganzes × 100<br>Grundwert: Teil : Prozent × 100</p><p class="ex">30 von 120 → 30 : 120 = 0.25 → 25 %</p></div>

drei:`<div class="rule"><h3>Proportional: je mehr, desto mehr</h3><p>Zuerst auf 1 rechnen, dann auf die gesuchte Menge.</p><p class="ex">3 m kosten 4.50 CHF<br>1 m kostet 4.50 : 3 = 1.50 CHF<br>7 m kosten 7 × 1.50 = 10.50 CHF</p></div>

<div class="rule"><h3>Tipp</h3><p>Schreib eine kleine Tabelle mit zwei Spalten. Frag dich zuerst: Wird es mehr oder weniger?</p></div>`,

<div class="rule"><h3>Zeit</h3><p class="ex">1 h = 60 min &nbsp;·&nbsp; 0.5 h = 30 min &nbsp;·&nbsp; 15 min = 0.25 h &nbsp;·&nbsp; 6 min = 0.1 h</p></div>

<div class="rule"><h3>Merksatz</h3><p>Von gross nach klein: mal. Von klein nach gross: geteilt.</p></div>`,

<div class="rule"><h3>Probe</h3><p>Setz dein x ein: 3 · 5 + 5 = 20 ✓</p></div>
<div class="rule"><h3>Formeldreieck</h3><svg class="tri" viewBox="0 0 160 120" role="img" aria-label="Formeldreieck: U oben, R und I unten"><path d="M80 6 L154 114 L6 114 Z" fill="none" stroke="currentColor" stroke-width="3"/><line x1="34" y1="72" x2="126" y2="72" stroke="currentColor" stroke-width="2"/><line x1="80" y1="72" x2="80" y2="114" stroke="currentColor" stroke-width="2"/><text x="80" y="60" text-anchor="middle" font-size="26" font-weight="700">U</text><text x="54" y="104" text-anchor="middle" font-size="24" font-weight="700">R</text><text x="106" y="104" text-anchor="middle" font-size="24" font-weight="700">I</text></svg><p>Halte den gesuchten Buchstaben zu. Was übrig bleibt, ist die Formel: Übereinander heisst geteilt, nebeneinander heisst mal.</p><p class="ex">I = U : R &nbsp;·&nbsp; R = U : I &nbsp;·&nbsp; U = R · I</p><p>Das gleiche Dreieck funktioniert für P = U · I und W = P · t.</p></div>`,
geo:`<div class="rule"><h3>Rechteck und Quadrat</h3><p class="ex">Umfang u = 2 · (l + b) &nbsp;·&nbsp; Fläche A = l · b</p><p class="ex">Quadrat: u = 4 · s &nbsp;·&nbsp; A = s · s</p></div>

/* ---------- Speicher ---------- */
const KEY='mathe-werkstatt-elektro-v1';
let S={stats:{},wrong:[],plan:{},blitzBest:0,tests:[],days:[],solved:0};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&typeof s==='object')S=Object.assign(S,s);}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function st(t,l){S.stats[t]=S.stats[t]||{};S.stats[t][l]=S.stats[t][l]||{last:[],n:0,ok:0};return S.stats[t][l];}
function mastered(t,l){const s=S.stats[t]&&S.stats[t][l];return !!s&&s.last.filter(Boolean).length>=8;}
function nMastered(t){return [1,2,3].filter(l=>mastered(t,l)).length;}
function sugLevel(t){for(const l of [1,2,3])if(!mastered(t,l))return l;return 3;}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function record(it,ok){const s=st(it.t,it.l);s.last.push(ok?1:0);if(s.last.length>10)s.last.shift();s.n++;if(ok)s.ok++;S.solved++;const d=today();if(!S.days.includes(d)){S.days.push(d);if(S.days.length>400)S.days.shift();}if(!ok)addWrong(it);save();}
function addWrong(it){if(S.wrong.some(w=>w.q===it.q))return;S.wrong.unshift(it);if(S.wrong.length>40)S.wrong.pop();}
function streakDays(){const set=new Set(S.days);let n=0;const d=new Date();const key=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');if(!set.has(key(d)))d.setDate(d.getDate()-1);while(set.has(key(d))){n++;d.setDate(d.getDate()-1);}return n;}
function weakest(){return TOPICS.slice().sort((a,b)=>{const ma=nMastered(a.id),mb=nMastered(b.id);if(ma!==mb)return ma-mb;const acc=t=>{let n=0,o=0;[1,2,3].forEach(l=>{const s=S.stats[t]&&S.stats[t][l];if(s){n+=s.n;o+=s.ok;}});return n?o/n:-1;};return acc(a.id)-acc(b.id);})[0];}
function curPlan(){for(let w=0;w<PLAN.length;w++)for(let e=0;e<4;e++)if(!S.plan['w'+(w+1)+'e'+(e+1)])return {w,e};return null;}
function weekTopic(w){const p=PLAN[w];if(p.t==='weak')return weakest();if(p.t==='test')return null;return TOPIC[p.t];}
function sessionInfo(w,e){const p=PLAN[w];
  if(p.t==='test'){const a=[['Prüfungstest','#test',['30 Minuten, 20 Aufgaben','Danach die falschen Aufgaben anschauen']],['Fehlerheft','#fehler',['5 Min Blitzrechnen','15 Min Fehlerheft leer machen']],['Prüfungstest mit Profi-Aufgaben','#test',['30 Minuten, 20 Aufgaben (Stufe 2–3)','Danach die falschen Aufgaben anschauen']],['Schwächstes Thema','#thema-'+weakest().id,['5 Min Blitzrechnen','15 Min '+weakest().name]]][e];return {title:a[0],go:a[1],steps:a[2]};}
  const tp=weekTopic(w);
  if(e<3)return {title:tp.name,go:'#thema-'+tp.id,steps:['3 Min Blitzrechnen','12 Min '+tp.name+' (Stufe '+sugLevel(tp.id)+')','5 Min Fehlerheft']};
  const prev=w>0?weekTopic(w-1):null;return {title:'Wiederholung: '+tp.name,go:'#thema-'+tp.id,steps:['10 Aufgaben '+tp.name,prev?'10 Aufgaben '+prev.name+' (Vorwoche)':'5 Min Blitzrechnen','Fehlerheft']};}

/* ---------- Antwort prüfen ---------- */
function parseIn(raw,allowFrac){let s=String(raw).replace(/[−–]/g,'-').replace(/[’'`\s]/g,'').replace(/,/g,'.').replace(/[^0-9.\-\/]/g,'');if(!s)return null;
  const num=x=>/^-?(\d+\.?\d*|\.\d+)$/.test(x)?parseFloat(x):NaN;
  if(s.includes('/')){if(!allowFrac)return {err:'frac'};const parts=s.split('/');if(parts.length!==2)return null;const n=num(parts[0]),d=num(parts[1]);if(isNaN(n)||isNaN(d)||d===0)return null;return {v:n/d,n,d,frac:true};}
  const v=num(s);if(isNaN(v))return null;return {v};}
function check(it,raw){
  if(it.kind==='mc')return {ok:raw===it.ci};
  const p=parseIn(raw,it.kind==='frac'||!it.noFrac);
  if(!p)return {ok:false,invalid:true,msg:'Bitte gib eine Zahl ein, zum Beispiel 12 oder 3.5.'};
  if(p.err)return {ok:false,invalid:true,msg:'Bitte als Dezimalzahl eingeben, nicht als Bruch.'};
  if(it.kind==='frac'){const target=it.fa[0]/it.fa[1];
    if(it.reduced){if(!p.frac&&it.fa[1]!==1)return {ok:false,invalid:true,msg:'Bitte als Bruch eingeben, zum Beispiel 3/4.'};
      if(Math.abs(p.v-target)>1e-9)return {ok:false};
      if(p.frac&&(gcd(p.n,p.d)!==1||p.d<0))return {ok:false,invalid:true,msg:'Der Wert stimmt – aber du kannst noch weiter kürzen.'};
      return {ok:true};}
    return {ok:Math.abs(p.v-target)<1e-4};}
  const tol=Math.max(it.tol||0,it.rel?Math.abs(it.a)*it.rel:0,1e-6);
  return {ok:Math.abs(p.v-it.a)<=tol};}
function ansText(it){if(it.kind==='mc')return it.choices[it.ci];if(it.at)return it.at;return (it.money?C(it.a):N(it.a))+(it.u?' '+it.u:'');}

function viewTopic(id){const tp=TOPIC[id];
  if(!CUR||CUR.mode!=='topic'||CUR.t!==id)CUR={mode:'topic',t:id,l:sugLevel(id),tab:'ueben',streak:0};
  app.innerHTML=`${topbar()}<header class="t-head"><span class="fuse">${tp.f}</span><h1>${tp.name}</h1><p class="why"><b>Im Beruf:</b> ${tp.why}</p></header>
  <div class="tabs" role="tablist"><button role="tab" id="tab-ueben" data-act="tab" data-tab="ueben" aria-selected="${CUR.tab==='ueben'}">Üben</button><button role="tab" id="tab-erkl" data-act="tab" data-tab="erkl" aria-selected="${CUR.tab==='erkl'}">So geht’s</button></div>
  <div id="panel"></div>`;
  renderTopicPanel();}
function levelsHTML(){const t=CUR.t;return `<div class="levels">${[1,2,3].map(l=>{const s=(S.stats[t]&&S.stats[t][l])||{last:[]};const dots=Array.from({length:10},(_,i)=>{const v=s.last[i];return `<i class="${v===1?'y':v===0?'n':''}"></i>`;}).join('');return `<button class="lvl${mastered(t,l)?' done':''}" data-act="lvl" data-l="${l}" aria-pressed="${CUR.l===l}">Stufe ${l}<small>${['Grundlagen','Standard','Profi'][l-1]}${mastered(t,l)?' ✓':''}</small><span class="meter" aria-hidden="true">${dots}</span></button>`;}).join('')}</div><p class="lvl-info">Die Kästchen zeigen deine letzten 10 Aufgaben. 8 richtige = Stufe geschafft.</p>`;}
function renderTopicPanel(){const panel=document.getElementById('panel');
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===CUR.tab));
  if(CUR.tab==='erkl'){panel.innerHTML=`<div class="expl">${EX[CUR.t]}<div class="rule job"><h3>Wozu brauche ich das?</h3><p>${TOPIC[CUR.t].why}</p></div><div class="row"><button class="btn primary" data-act="tab" data-tab="ueben">Jetzt üben</button></div></div>`;return;}
  panel.innerHTML=`<div id="lv">${levelsHTML()}</div><div class="card qcard" id="qcard"></div>`;
  if(!CUR.it||CUR.it.l!==CUR.l||CUR.it.t!==CUR.t)newQ();else renderQ();}
function newQ(){if(CUR.mode==='fehler'){if(!S.wrong.length){CUR.it=null;renderQ();return;}CUR.it=JSON.parse(JSON.stringify(S.wrong[0]));}
  else{let it,g=0;do{it=gen(CUR.t,CUR.l);g++;}while(CUR.it&&it.q===CUR.it.q&&g<6);CUR.it=it;}
  CUR.tries=0;CUR.done=false;CUR.hint=false;renderQ();}
function inputHTML(it,id,val){
  if(it.kind==='mc')return `<div class="mc" role="group" aria-label="Antwort wählen">${it.choices.map((c,i)=>`<button type="button" data-act="mc" data-i="${i}" class="${val===i?'sel':''}">${c}</button>`).join('')}</div>`;
  const keys=(TOPIC[it.t].keys||[]).map(k=>`<button type="button" data-act="key" data-k="${k}" aria-label="${k==='−'?'Minuszeichen':'Bruchstrich'} einfügen">${k}</button>`).join('');
  return `<form class="ans" id="ansform" autocomplete="off"><span class="pre">${it.pre||''}</span><input id="${id}" inputmode="decimal" enterkeyhint="done" placeholder="Antwort" aria-label="Deine Antwort" value="${val!=null?esc(val):''}"><span class="unit">${it.u||''}</span>${id==='ans'?'<button class="btn primary" type="submit">Prüfen</button>':''}</form>${keys?`<div class="keys">${keys}</div>`:''}`;}
function renderQ(){const box=document.getElementById('qcard');if(!box)return;const it=CUR.it;
  if(!it){box.innerHTML=`<h2>Fehlerheft ist leer</h2><p>Super! Alle Fehler sind verbessert. Falsch gelöste Aufgaben kommen automatisch wieder hierher.</p><div class="row"><a class="btn primary" href="#start">Zur Übersicht</a></div>`;return;}
  box.innerHTML=`<div class="qhead"><span>${CUR.mode==='fehler'?TOPIC[it.t].name+' · ':''}Stufe ${it.l}</span>${it.calc?'<span class="chip calc">Taschenrechner erlaubt</span>':''}<span class="streak">${CUR.streak>=3?CUR.streak+' richtig in Folge!':''}</span></div>

function stepsHTML(it){return `<ol class="steps">${it.steps.map(s=>`<li>${s}</li>`).join('')}</ol>`;}
const PRAISE=['Richtig!','Stimmt genau!','Sauber gerechnet!','Korrekt – weiter so!','Genau so!'];
function finishQ(ok,viaReveal){const it=CUR.it,fb=document.getElementById('fb');CUR.done=true;
  record(it,ok);
  if(CUR.mode==='fehler'){if(ok)S.wrong=S.wrong.filter(w=>w.q!==it.q);else{const i=S.wrong.findIndex(w=>w.q===it.q);if(i>=0){const [w]=S.wrong.splice(i,1);S.wrong.push(w);}}save();}
  CUR.streak=ok?CUR.streak+1:0;
  const head=ok?`<div class="msg good"><strong>${P(PRAISE)}</strong>${CUR.mode==='fehler'?'Diese Aufgabe ist aus dem Fehlerheft gestrichen.':'So kann man rechnen:'}${stepsHTML(it)}</div>`
    :`<div class="msg bad"><strong>${viaReveal?'Lösungsweg':'Leider nicht richtig'}</strong>Richtig ist: <b>${ansText(it)}</b>${stepsHTML(it)}<p class="muted" style="margin-top:6px">${CUR.mode==='fehler'?'Die Aufgabe bleibt im Fehlerheft.':'Die Aufgabe kommt ins Fehlerheft.'}</p></div>`;
  fb.innerHTML=head+`<div class="row"><button class="btn primary" data-act="next" id="nextbtn" type="button">Nächste Aufgabe →</button></div>`;
  box_lock();
  const lv=document.getElementById('lv');if(lv&&CUR.mode==='topic')lv.innerHTML=levelsHTML();
  document.getElementById('nextbtn').focus({preventScroll:true});}
function box_lock(){document.querySelectorAll('#qcard input, #qcard .mc button, #qcard .keys button, #qcard form .btn, #qcard [data-act="hint"], #qcard [data-act="reveal"]').forEach(el=>el.disabled=true);}
function submitAnswer(raw){const it=CUR.it,fb=document.getElementById('fb');if(!it||CUR.done)return;
  const res=check(it,raw);
  if(res.invalid){fb.innerHTML=`<div class="msg hint"><strong>Kurz prüfen</strong>${res.msg}</div>`;return;}
  if(it.kind==='mc'){document.querySelectorAll('#qcard .mc button').forEach((b,i)=>{if(i===it.ci)b.classList.add('right');else if(i===raw)b.classList.add('wrong');});finishQ(res.ok);return;}
  if(res.ok){finishQ(true);return;}
  CUR.tries++;
  if(CUR.tries<2){fb.innerHTML=`<div class="msg bad"><strong>Noch nicht ganz</strong>Schau nochmal genau hin – du hast einen zweiten Versuch.</div><div class="msg hint"><strong>Tipp</strong>${it.hint}</div>`;const inp=document.getElementById('ans');inp.select();}
  else finishQ(false);}

/* ---------- Ansicht: Fehlerheft ---------- */
function viewFehler(){
  const by={};S.wrong.forEach(w=>{by[w.t]=(by[w.t]||0)+1;});
  app.innerHTML=`${topbar()}<header class="t-head"><h1>Fehlerheft</h1><p class="why">Hier landen alle Aufgaben, die nicht geklappt haben. Wenn du eine richtig löst, wird sie gestrichen.</p></header>
  ${S.wrong.length?`<div class="row">${Object.keys(by).map(t=>`<span class="chip">${TOPIC[t].name}: ${by[t]}</span>`).join('')}</div>`:''}
  <div class="card qcard" id="qcard"></div>
  ${S.wrong.length?`<div class="row"><button class="btn small danger" data-act="clearwrong" type="button">${resetArm?'Wirklich alles löschen?':'Fehlerheft leeren'}</button></div>`:''}`;
  CUR={mode:'fehler',streak:0};newQ();}

/* ---------- Ansicht: Prüfungstest ---------- */
function makeTest(pro){const items=[];TOPICS.forEach(tp=>{(pro?[2,3]:[1,2]).forEach(l=>{let it,g=0;do{it=gen(tp.id,l);g++;}while(it.calc&&g<30);items.push(it);});});shuffle(items);return {items,ans:items.map(()=>null),idx:0,end:Date.now()+30*60*1000,pro,done:false};}
function viewTest(){if(!T)testSetup();else if(T.done)testResult();else testRun();}
function testSetup(){const hist=S.tests.slice(-8);
  app.innerHTML=`${topbar()}<header class="t-head"><h1>Prüfungstest</h1><p class="why">Trainiert das Format von Eignungstests: viele Aufgaben, wenig Zeit, ohne Taschenrechner. Das Ergebnis siehst du erst am Schluss.</p></header>
  <div class="card"><h2>So läuft es</h2><ol class="steps"><li>20 Aufgaben aus allen 10 Themen</li><li>30 Minuten Zeit – die Uhr läuft oben mit</li><li>Du kannst Aufgaben überspringen und später zurückkommen</li><li>Am Schluss: Punkte, Lösungswege und welche Themen du üben solltest</li></ol>
  <div class="row"><button class="btn primary" data-act="tstart" data-pro="0" type="button">Start: Grundlagen (Stufe 1–2)</button><button class="btn" data-act="tstart" data-pro="1" type="button">Start: Profi (Stufe 2–3)</button></div></div>
  ${hist.length?`<section><h2>Deine letzten Tests</h2><div class="card"><div class="hist" role="img" aria-label="Ergebnisse der letzten Tests">${hist.map(h=>`<div style="height:${Math.max(4,h.s/h.n*100)}%"><span>${h.s}</span></div>`).join('')}</div><p class="muted">Punkte von 20 · ${hist.map(h=>h.pro?'Profi':'Grundlagen').slice(-1)[0]==='Profi'?'letzter Test: Profi':'letzter Test: Grundlagen'}</p></div></section>`:''}`;}
function fmtTime(ms){const s=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function testRun(){const it=T.items[T.idx],open=T.ans.filter(a=>a==null||a==='').length;
  app.innerHTML=`${topbar()}<div class="testbar"><span>Aufgabe ${T.idx+1} von 20</span><span class="timer" id="timer">${fmtTime(T.end-Date.now())}</span></div>
  <div class="jump" aria-label="Zu Aufgabe springen">${T.items.map((_,i)=>`<button type="button" data-act="tjump" data-i="${i}" class="${i===T.idx?'cur ':''}${T.ans[i]!=null&&T.ans[i]!==''?'done':''}" aria-label="Aufgabe ${i+1}">${i+1}</button>`).join('')}</div>
  <div class="card qcard" id="tcard"><div class="qhead"><span>${TOPIC[it.t].name}</span></div><div class="qtext">${it.q}</div>${it.svg||''}${inputHTML(it,'tans',T.ans[T.idx])}</div>
  <div class="row"><button class="btn ghost" data-act="tprev" type="button" ${T.idx===0?'disabled':''}>← Zurück</button><button class="btn primary" data-act="tnext" type="button">${T.idx===19?'Zur Übersicht':'Weiter →'}</button></div>
  <div class="row"><button class="btn${submitArm?' danger':''}" data-act="tfinish" type="button">${submitArm&&open?`Wirklich abgeben? ${open} Aufgabe${open===1?'':'n'} offen`:'Test abgeben'}</button></div>`;
  const inp=document.getElementById('tans');if(inp){inp.addEventListener('input',()=>{T.ans[T.idx]=inp.value;});if(window.matchMedia('(pointer:fine)').matches)inp.focus();}
  clearInterval(timer);timer=setInterval(()=>{const el=document.getElementById('timer');const left=T.end-Date.now();if(left<=0){clearInterval(timer);testFinish();return;}if(el){el.textContent=fmtTime(left);el.classList.toggle('low',left<3*60*1000);}},1000);}
function testFinish(){clearInterval(timer);T.res=T.items.map((it,i)=>{const a=T.ans[i];if(a==null||a==='')return false;if(it.kind==='mc')return a===it.ci;const r=check(it,a);return !!r.ok;});
  T.items.forEach((it,i)=>record(it,T.res[i]));T.done=true;const s=T.res.filter(Boolean).length;S.tests.push({d:today(),s,n:20,pro:T.pro});if(S.tests.length>30)S.tests.shift();save();submitArm=false;testResult();window.scrollTo(0,0);}
function testResult(){const s=T.res.filter(Boolean).length,pct=Math.round(s/20*100);
  const verdict=pct>=80?['Sehr gut','Du bist auf einem starken Weg zum Eignungstest.']:pct>=60?['Gut','Ein paar Lücken – schau dir die roten Themen an.']:['Weiter üben','Die Themen unten zeigen dir, wo du am meisten gewinnen kannst.'];
  const per=TOPICS.map(tp=>{const idx=T.items.map((it,i)=>it.t===tp.id?i:-1).filter(i=>i>=0);return {tp,ok:idx.filter(i=>T.res[i]).length,n:idx.length};});
  app.innerHTML=`${topbar()}<header class="t-head"><h1>Testergebnis</h1></header>
  <div class="card"><div class="row" style="align-items:flex-end;gap:16px"><span class="big">${s}<span style="font-size:.45em;color:var(--muted)"> / 20</span></span><div><h2>${verdict[0]}</h2><p>${verdict[1]}</p></div></div>
  <div class="bars">${per.map(p=>{const r=p.ok/p.n;return `<div class="bar-row"><a href="#thema-${p.tp.id}">${p.tp.name}</a><div class="track"><div class="fill ${r===1?'':r>=0.5?'mid':'low'}" style="width:${Math.max(4,r*100)}%"></div></div><span>${p.ok}/${p.n}</span></div>`;}).join('')}</div>
  <div class="row"><button class="btn primary" data-act="tnew" type="button">Neuen Test starten</button><a class="btn ghost" href="#fehler">Zum Fehlerheft</a></div></div>
  <section><h2>Alle Aufgaben</h2><div class="res-list">${T.items.map((it,i)=>{const a=T.ans[i],given=(a==null||a==='')?'– (keine Antwort)':(it.kind==='mc'?it.choices[a]:esc(a)+(it.u?' '+it.u:''));return `<details class="res-item${T.res[i]?'':' no'}"><summary><span class="muted">${i+1}. ${TOPIC[it.t].name} · ${T.res[i]?'richtig':'falsch'}</span><span class="qtext">${it.q}</span><span>Deine Antwort: <b>${given}</b>${T.res[i]?'':` · Richtig: <b>${ansText(it)}</b>`}</span></summary>${stepsHTML(it)}</details>`;}).join('')}</div></section>`;}

/* ---------- Ansicht: Blitzrechnen ---------- */
function genBlitz(){const t=R(0,4);
  if(t===0){const a=R(2,10),b=R(2,10);return {q:`${a} × ${b}`,a:a*b};}
  if(t===1){const a=R(2,10),b=R(2,10);return {q:`${a*b} : ${a}`,a:b};}
  if(t===2){const a=R(11,79),b=R(11,99-a);return {q:`${a} + ${b}`,a:a+b};}
  if(t===3){const a=R(30,99),b=R(11,a-1);return {q:`${a} − ${b}`,a:a-b};}
  const a=R(2,99),f=P([10,100]);return {q:`${a} × ${f}`,a:a*f};}
function viewBlitz(){if(!B||B.state==='setup'){B={state:'setup'};
  app.innerHTML=`${topbar()}<header class="t-head"><h1>Blitzrechnen</h1><p class="why">60 Sekunden Kopfrechnen: Einmaleins, Plus, Minus, mal 10 und 100. Tippe die Antwort und drücke Enter.</p></header>
  <div class="card"><p>Dein Bestwert: <b>${S.blitzBest}</b> richtige Aufgaben</p><div class="row"><button class="btn primary" data-act="bstart" type="button">Start (60 Sekunden)</button></div></div>`;return;}
  if(B.state==='run'){app.innerHTML=`${topbar()}<div class="testbar"><span>Richtig: <b id="bok">${B.ok}</b></span><span class="timer" id="btime">60</span></div><div class="tbar"><div id="bbar" style="width:100%"></div></div>
  <div class="card" id="bcard"><div class="blitz-q" id="bq">${B.q.q}</div><form class="ans" id="bform" autocomplete="off"><span class="pre"></span><input id="bans" inputmode="numeric" enterkeyhint="next" aria-label="Antwort"><span class="unit"></span><button class="btn primary" type="submit">OK</button></form></div>`;
  document.getElementById('bans').focus();
  clearInterval(timer);timer=setInterval(()=>{const left=B.end-Date.now();if(left<=0){clearInterval(timer);B.state='end';if(B.ok>S.blitzBest){S.blitzBest=B.ok;B.rec=true;}const d=today();if(!S.days.includes(d))S.days.push(d);save();viewBlitz();return;}const bt=document.getElementById('btime'),bb=document.getElementById('bbar');if(bt)bt.textContent=Math.ceil(left/1000);if(bb)bb.style.width=(left/600)+'%';},200);return;}
  app.innerHTML=`${topbar()}<header class="t-head"><h1>Blitzrechnen</h1></header><div class="card"><span class="big">${B.ok}</span><h2>${B.rec?'Neuer Bestwert!':'richtige Aufgaben'}</h2><p class="muted">${B.bad} falsch · Bestwert: ${S.blitzBest}</p><div class="row"><button class="btn primary" data-act="bstart" type="button">Nochmal</button><a class="btn ghost" href="#start">Zur Übersicht</a></div></div>`;}

/* ---------- Ansicht: Wochenplan ---------- */
function viewPlan(){const cp=curPlan();
  app.innerHTML=`${topbar()}<header class="t-head"><h1>Wochenplan</h1><p class="why">12 Wochen · 4 Einheiten pro Woche · je 20 Minuten. Am besten an festen Tagen, zum Beispiel Mo, Di, Do und Sa. Wer schneller ist, darf vorspringen. Wer länger braucht, bleibt eine Woche länger beim Thema.</p></header>
  <div class="card"><h3>Eine Einheit (20 Minuten)</h3><ol class="steps"><li><b>3 Min Blitzrechnen</b> – Kopf aufwärmen</li><li><b>12 Min Thema der Woche</b> – zuerst «So geht’s» lesen, dann üben</li><li><b>5 Min Fehlerheft</b> – alte Fehler verbessern</li></ol><p class="muted">Einheit 4 jeder Woche ist eine Wiederholung mit dem Thema der Vorwoche.</p></div>
  <div class="weeks">${PLAN.map((p,w)=>{const tp=weekTopic(w),title=p.t==='test'?'Prüfungstraining':p.t==='weak'?'Schwächstes Thema: '+tp.name:tp.name,link=p.t==='test'?'#test':'#thema-'+tp.id,done=[1,2,3,4].every(e=>S.plan['w'+(w+1)+'e'+e]);
    return `<article class="week${cp&&cp.w===w?' now':''}${done?' fin':''}"><header><span class="wk">Woche ${w+1}</span><h3>${title}</h3><a href="${link}">Üben →</a></header><p class="muted">${p.goal}</p><div class="sess">${[1,2,3,4].map(e=>{const k='w'+(w+1)+'e'+e;return `<label for="${k}"><input type="checkbox" id="${k}" data-act="plan" data-k="${k}" ${S.plan[k]?'checked':''}> Einheit ${e}</label>`;}).join('')}</div></article>`;}).join('')}</div>
  <section aria-labelledby="h-tips"><h2 id="h-tips">Tipps für Eltern</h2><div class="card"><ul class="tips">
  <li><b>Kurz und regelmässig.</b> 4 × 20 Minuten pro Woche bringen mehr als zwei Stunden am Sonntag.</li>
  <li><b>Ohne Taschenrechner üben.</b> Nur bei Aufgaben mit dem Hinweis «Taschenrechner erlaubt» darf er benutzt werden. Kopfrechnen ist in Eignungstests und auf der Baustelle gefragt.</li>
  <li><b>Ausdauer loben, nicht nur Resultate.</b> Fehler sind normal. Sie landen im Fehlerheft und werden später wiederholt.</li>
  <li><b>Lösungsweg laut erklären lassen.</b> Wer erklären kann, wie er gerechnet hat, hat es verstanden.</li>
  <li><b>Mathe im Alltag.</b> Rabatte im Laden ausrechnen, gemeinsam die Stromrechnung anschauen (kWh, Rappen), beim Kochen Mengen umrechnen.</li>
  <li><b>Eignungstest.</b> Viele Lehrbetriebe verlangen einen Test wie Multicheck oder Basic-Check. Der Prüfungstest hier trainiert das Format «viele Aufgaben, wenig Zeit».</li>
  <li><b>Schnupperlehre.</b> Ein paar Tage als Elektroinstallateur/in zeigen, wofür man Mathe braucht – das motiviert mehr als jede Erklärung.</li>
  <li><b>Mit der Lehrperson reden.</b> Sie weiss, welche Themen in der Klasse gerade dran sind, und kann den Plan anpassen.</li>
  </ul></div></section>
  <section><h2>Fortschritt</h2><div class="card"><p class="muted">Der Fortschritt wird auf diesem Gerät gespeichert, nicht im Internet. Wer auf einem anderen Gerät weiterüben will, kann ihn mit einem Code übertragen.</p>
  <h3>Auf ein anderes Gerät übertragen</h3>
  <ol class="steps"><li>Hier auf «Code erstellen» tippen und den Code kopieren.</li><li>Den Code an sich selbst schicken (z. B. per WhatsApp oder E-Mail).</li><li>Auf dem anderen Gerät die App öffnen, Wochenplan → Code einfügen → «Code übernehmen».</li></ol>
  <div class="row"><button class="btn small" data-act="export" type="button">Code erstellen</button><button class="btn small ghost" data-act="copycode" type="button" id="copybtn" hidden>Code kopieren</button></div>
  <label for="codebox" class="sr">Fortschritts-Code</label><textarea id="codebox" class="code" placeholder="Hier erscheint der Code – oder füge hier einen Code von einem anderen Gerät ein." spellcheck="false"></textarea>
  <div class="row"><button class="btn small" data-act="import" type="button">Code übernehmen</button></div><p id="codemsg" class="muted" aria-live="polite"></p>
  <h3>Zurücksetzen</h3><div class="row"><button class="btn small danger" data-act="reset" type="button">${resetArm?'Wirklich alles löschen? Nochmals tippen':'Fortschritt zurücksetzen'}</button></div></div></section>`;}

/* ---------- App-Installation ---------- */
let installEvt=null;
const isStandalone=()=>window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(!location.hash||location.hash==='#start')viewHome();});
window.addEventListener('appinstalled',()=>{installEvt=null;S.hideInstall=true;save();});
function installHTML(){if(isStandalone()||S.hideInstall||location.protocol==='file:')return '';
  const how=installEvt?`<div class="row"><button class="btn primary" data-act="install" type="button">App installieren</button><button class="btn ghost small" data-act="hideinstall" type="button">Nicht jetzt</button></div>`
   :isIOS()?`<p>In <b>Safari</b> unten auf das Teilen-Symbol (Quadrat mit Pfeil) tippen, dann <b>«Zum Home-Bildschirm»</b>.</p><div class="row"><button class="btn ghost small" data-act="hideinstall" type="button">Ausblenden</button></div>`
   :`<p>Im Browser-Menü (⋮) auf <b>«App installieren»</b> oder <b>«Zum Startbildschirm hinzufügen»</b> tippen.</p><div class="row"><button class="btn ghost small" data-act="hideinstall" type="button">Ausblenden</button></div>`;
  return `<section class="card install"><h3>Als App auf den Startbildschirm</h3><p class="muted">Dann startet die Mathe-Werkstatt wie eine normale App – und funktioniert auch ohne Internet.</p>${how}</section>`;}

/* ---------- Fortschritt übertragen ---------- */
function exportCode(){return 'MW1:'+btoa(unescape(encodeURIComponent(JSON.stringify(S))));}
function importCode(code){code=String(code).trim().replace(/\s+/g,'');if(code.indexOf('MW1:')!==0)throw new Error('format');const d=JSON.parse(decodeURIComponent(escape(atob(code.slice(4)))));if(!d||typeof d!=='object'||!d.stats)throw new Error('format');return d;}

/* ---------- Router & Ereignisse ---------- */
function route(){clearInterval(timer);resetArm=false;submitArm=false;const h=(location.hash||'').slice(1);
  if(h!=='blitz'&&B&&B.state==='run')B=null;
  if(h.indexOf('thema-')===0&&TOPIC[h.slice(6)])return viewTopic(h.slice(6));
  if(h==='test')return viewTest();if(h==='blitz')return viewBlitz();if(h==='fehler')return viewFehler();if(h==='plan')return viewPlan();
  if(CUR&&CUR.mode==='fehler')CUR=null;viewHome();}
window.addEventListener('hashchange',()=>{route();window.scrollTo(0,0);});

app.addEventListener('submit',e=>{e.preventDefault();
  if(e.target.id==='ansform'){if(CUR&&CUR.done){newQ();return;}submitAnswer(document.getElementById('ans').value);}
  else if(e.target.id==='bform'){const inp=document.getElementById('bans'),p=parseIn(inp.value,false),card=document.getElementById('bcard');if(!p||p.err)return;if(Math.abs(p.v-B.q.a)<1e-9){B.ok++;card.className='card flash-ok';}else{B.bad++;card.className='card flash-no';}void card.offsetWidth;B.q=genBlitz();document.getElementById('bq').textContent=B.q.q;document.getElementById('bok').textContent=B.ok;inp.value='';inp.focus();}});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='tans'){e.preventDefault();T.ans[T.idx]=e.target.value;if(T.idx<19){T.idx++;testRun();}}});
app.addEventListener('change',e=>{const el=e.target;if(el.dataset&&el.dataset.act==='plan'){S.plan[el.dataset.k]=el.checked;save();viewPlan();}});
app.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.dataset.act==='plan')return;const act=el.dataset.act;
  switch(act){
  case 'install':if(installEvt){installEvt.prompt();installEvt.userChoice.finally(()=>{installEvt=null;viewHome();});}break;
  case 'hideinstall':S.hideInstall=true;save();viewHome();break;
  case 'export':{const box=document.getElementById('codebox');box.value=exportCode();box.select();document.getElementById('copybtn').hidden=false;document.getElementById('codemsg').textContent='Code erstellt. Kopiere ihn und schick ihn an dich selbst.';break;}
  case 'copycode':{const box=document.getElementById('codebox'),msg=document.getElementById('codemsg');const done=()=>{msg.textContent='Kopiert!';};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(box.value).then(done,()=>{box.select();msg.textContent='Bitte den markierten Code von Hand kopieren.';});else{box.select();try{document.execCommand('copy');done();}catch(_){msg.textContent='Bitte den markierten Code von Hand kopieren.';}}break;}
  case 'import':{const msg=document.getElementById('codemsg');try{const d=importCode(document.getElementById('codebox').value);S=Object.assign({stats:{},wrong:[],plan:{},blitzBest:0,tests:[],days:[],solved:0},d);save();CUR=null;T=null;viewPlan();document.getElementById('codemsg').textContent='Fortschritt übernommen ✓';}catch(_){msg.textContent='Dieser Code funktioniert nicht. Bitte den ganzen Code kopieren – er beginnt mit «MW1:».';}break;}
  case 'tab':CUR.tab=el.dataset.tab;renderTopicPanel();break;
  case 'lvl':CUR.l=+el.dataset.l;CUR.streak=0;document.getElementById('lv').innerHTML=levelsHTML();newQ();break;
  case 'hint':{const fb=document.getElementById('fb');if(!fb.querySelector('.hint'))fb.insertAdjacentHTML('afterbegin',`<div class="msg hint"><strong>Tipp</strong>${CUR.it.hint}</div>`);break;}
  case 'reveal':if(!CUR.done)finishQ(false,true);break;
  case 'next':newQ();break;
  case 'mc':{const i=+el.dataset.i;if(T&&!T.done&&location.hash==='#test'){T.ans[T.idx]=i;document.querySelectorAll('#tcard .mc button').forEach((b,j)=>b.classList.toggle('sel',j===i));document.querySelectorAll('.jump button')[T.idx].classList.add('done');}else submitAnswer(i);break;}
  case 'key':{const inp=document.getElementById('ans')||document.getElementById('tans');if(!inp||inp.disabled)break;const s=inp.selectionStart??inp.value.length,en=inp.selectionEnd??inp.value.length;inp.value=inp.value.slice(0,s)+el.dataset.k+inp.value.slice(en);inp.focus();try{inp.setSelectionRange(s+1,s+1);}catch(_){}if(inp.id==='tans')T.ans[T.idx]=inp.value;break;}
  case 'sessdone':S.plan[el.dataset.k]=true;save();viewHome();break;
  case 'tstart':T=makeTest(el.dataset.pro==='1');submitArm=false;testRun();break;
  case 'tjump':T.idx=+el.dataset.i;testRun();break;
  case 'tprev':if(T.idx>0){T.idx--;testRun();}break;
  case 'tnext':if(T.idx<19){T.idx++;testRun();}else{const f=T.ans.findIndex(a=>a==null||a==='');if(f>=0){T.idx=f;testRun();}}break;
  case 'tfinish':{const open=T.ans.filter(a=>a==null||a==='').length;if(open&&!submitArm){submitArm=true;testRun();}else testFinish();break;}
  case 'tnew':T=null;testSetup();break;
  case 'bstart':B={state:'run',ok:0,bad:0,end:Date.now()+60000,q:genBlitz()};viewBlitz();break;
  case 'clearwrong':if(!resetArm){resetArm=true;el.textContent='Wirklich alles löschen?';}else{S.wrong=[];save();resetArm=false;viewFehler();}break;
  case 'reset':if(!resetArm){resetArm=true;el.textContent='Wirklich alles löschen? Nochmals tippen';}else{S={stats:{},wrong:[],plan:{},blitzBest:0,tests:[],days:[],solved:0};save();resetArm=false;CUR=null;T=null;viewPlan();}break;
  }});

window.__mw={gen,check,GEN,TOPICS,parseIn,ansText,exportCode,importCode};
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
route();
})();
</script>
</body>
